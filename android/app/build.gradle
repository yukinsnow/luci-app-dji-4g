plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'local.router.sms'
    compileSdk 35
    defaultConfig { applicationId 'local.router.sms'; minSdk 26; targetSdk 35; versionCode 7; versionName '0.5.1' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    packaging { resources { excludes += ['META-INF/versions/**/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES'] } }
}
dependencies {
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.compose.ui:ui:1.8.2'
    implementation 'androidx.compose.foundation:foundation:1.8.2'
    implementation 'androidx.compose.material:material-icons-core:1.7.8'
    implementation 'top.yukonga.miuix.kmp:miuix-android:0.4.5'
    implementation 'com.github.mwiede:jsch:2.28.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
